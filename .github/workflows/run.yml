name: Auto Update Stock Dashboard

on:
  schedule:
    # 11:00 AM EDT (15:00 UTC) — fires 11AM Institutional Research report
    - cron: "0 15 * * 1-5"
    # 2:00 PM EDT (18:00 UTC) — fires 2PM Mid-Day Intelligence report
    - cron: "0 18 * * 1-5"
    # 3:00 PM EDT (19:00 UTC) — fires 3PM Pre-Close Institutional report
    - cron: "0 19 * * 1-5"
    # 4:00 PM EDT (20:00 UTC) — fires 4PM EOD Summary report
    - cron: "0 20 * * 1-5"
  workflow_dispatch:   # Allows you to trigger it manually via the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Hard Reset Workspace
        # This fixes the "Overquota" by ensuring no old cache/sessions are reused
        run: |
          git clean -fdx
          rm -rf cache/ tb_cache/ __pycache__/ Output/
          mkdir -p docs/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Stock Report Script
        run: python Jan20_4.py
               
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ENABLE_EMAIL_REPORTS: ${{ secrets.ENABLE_EMAIL_REPORTS }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add the docs folder and your script file
          git add -f docs/
          git add Jan20_4.py
         
          # git add Prompt.py
          # Commit only if files actually changed
          git commit -m "Daily Dashboard Update (1PM EST): $(date +'%Y-%m-%d %H:%M')" || exit 0
          
          # Sync with remote to prevent conflicts
          git pull origin main --rebase
          git push origin main
