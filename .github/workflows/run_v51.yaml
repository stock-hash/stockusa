name: Market Scanner v5.6 Fixed

on:
  schedule:
    # Every day at 2:00 PM Eastern, including weekends and holidays.
    - cron: '5 14 * * *'
      timezone: America/New_York

  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send the dashboard email now (test run)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: America/New_York

concurrency:
  group: stockusa-dashboard-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy pytz python-dotenv peewee pandas_market_calendars==5.6.0

      - name: Enable daily report execution
        id: market_check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))

          print("Event:", os.environ["EVENT_NAME"])
          print("Actual start time ET:", now.isoformat())
          print("Daily reporting enabled, including weekends and holidays.")
          print("Market-hours restrictions do not skip this workflow.")
          print("Market-data freshness is still checked by the report.")

          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as fh:
              fh.write("run=true\n")
          PY

      - name: Verify uploaded A1 files and Python syntax
        if: steps.market_check.outputs.run == 'true'
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          files = [
              "run_github.py",
              "market_scanner_v5.py",
              "snapshot_upgrade.py",
              "run_a1.py",
              "a1_market_intelligence.py",
              "a1_quality.py",
              "a1_changes.py",
              "test_a1_quality.py",
              "test_section11.py",
              "a1_restore_layout.py",
              "install_a1_layout.py",
              "a1_ultimate_dashboard.py",
              "install_ultimate_dashboard.py",
              "test_ultimate_dashboard.py",
              "a1_email_sender.py",
              "test_a1_email_sender.py",
          ]

          for name in files:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit("Required file missing: " + name)
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

          for name in [
              "a1_reference_universes.json",
              "a1_universes.json",
          ]:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(
                      "Required configuration missing: " + name
                  )
              json.loads(path.read_text(encoding="utf-8-sig"))

          dashboard = Path(
              "a1_ultimate_dashboard.py"
          ).read_text(encoding="utf-8-sig")

          if "A1_ULTIMATE_DASHBOARD_V1_1" not in dashboard:
              raise SystemExit(
                  "Final dashboard v1.1 file is not installed"
              )

          print(
              "Required A1 files, Python syntax, JSON "
              "and dashboard version passed"
          )
          PY

      - name: Apply exact known dashboard CSS repair
        if: steps.market_check.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("run_github.py")
          source = path.read_text(encoding="utf-8")

          old = (
              ".page{display:none;padding:20px 22px}"
              ".page.activetable"
          )
          new = (
              ".page{display:none;padding:20px 22px}"
              ".page.active{display:block}table"
          )

          if old in source:
              path.write_text(
                  source.replace(old, new),
                  encoding="utf-8",
              )
              print("Applied exact known CSS repair locally")
          else:
              print("No known CSS repair needed")
          PY

      - name: Run offline A1 regression tests
        if: steps.market_check.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m unittest test_a1_quality test_section11 test_ultimate_dashboard test_a1_email_sender -v

      - name: Run market scanner and A1 Section 11
        id: scanner
        if: steps.market_check.outputs.run == 'true'
        env:
          # Disable the older report email.
          # The final dashboard email is sent after validation.
          SEND_EMAIL_REPORT: 'false'
          FORCE_EMAIL: 'false'
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/a1_started_at"
          python install_a1_layout.py
          python install_ultimate_dashboard.py
          python run_a1.py
          echo "did_run=true" >> "$GITHUB_OUTPUT"

      - name: Validate current outputs and final dashboard
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          docs = Path("docs")

          required = [
              "TopBottom_Universal.html",
              "latest_scan.json",
              "prices.json",
              "charts.json",
              "a1_tables.html",
              "a1_ai.json",
              "a1_audit.json",
              "a1_changes.json",
              "a1_comparison_baseline.json",
              "a1_ultimate_audit.json",
              "a1_dashboard.html",
          ]

          data = {}

          for name in required:
              path = docs / name

              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(
                      "Required output missing or empty: " + str(path)
                  )

              if path.suffix == ".json":
                  data[name] = json.loads(
                      path.read_text(encoding="utf-8")
                  )

          audit = data["a1_audit.json"]

          if audit.get("publish_ok") is not True:
              raise SystemExit("A1 audit rejected publication")

          started = datetime.fromisoformat(
              (Path(os.environ["RUNNER_TEMP"]) / "a1_started_at")
              .read_text()
              .strip()
              .replace("Z", "+00:00")
          )

          generated = datetime.fromisoformat(
              audit["generated_at"].replace("Z", "+00:00")
          )

          if generated.tzinfo is None:
              raise SystemExit("Audit timestamp has no timezone")

          if not (
              started - timedelta(seconds=5)
              <= generated
              <= datetime.now(timezone.utc) + timedelta(minutes=2)
          ):
              raise SystemExit(
                  "Audit timestamp is not from this scanner run"
              )

          changes = data["a1_changes.json"]

          if changes.get("status") not in [
              "FIRST_RUN",
              "NO_CHANGE",
              "CHANGES",
          ]:
              raise SystemExit(
                  "Section 11 comparison requires attention: "
                  + str(changes.get("status"))
              )

          if (
              changes.get("current_generated_at")
              != audit["generated_at"]
          ):
              raise SystemExit(
                  "Section 11 is not from this A1 report"
              )

          baseline = data["a1_comparison_baseline.json"]

          if baseline.get("generated_at") != audit["generated_at"]:
              raise SystemExit(
                  "Section 11 baseline did not advance"
              )

          ai_bytes = (docs / "a1_ai.json").stat().st_size
          ai_limit = int(
              os.environ.get("A1_AI_MAX_BYTES", "26000")
          )

          if ai_bytes > ai_limit:
              raise SystemExit("AI payload exceeds byte budget")

          ultimate = data["a1_ultimate_audit.json"]

          if ultimate.get("version") != "ultimate-v1.1-final":
              raise SystemExit(
                  "Final dashboard version is not ultimate-v1.1-final"
              )

          if (
              ultimate.get("sector_calculated_fields_complete")
              is not True
          ):
              raise SystemExit(
                  "Sector Change/Stage join is incomplete"
              )

          if ultimate.get("trend_strips_rendered_as_html") is not True:
              raise SystemExit(
                  "Seven-session strips are escaped"
              )

          if ultimate.get("all_prior_html_retained") is not True:
              raise SystemExit(
                  "Prior A1 evidence appendix was not retained"
              )

          if (
              ultimate.get("ultimate_html_bytes", 0)
              < ultimate.get("prior_html_bytes", 0)
          ):
              raise SystemExit(
                  "Ultimate dashboard is smaller than prior report"
              )

          a1_html = (docs / "a1_tables.html").read_text(
              encoding="utf-8"
          )

          if len(a1_html.encode("utf-8")) < 5000:
              raise SystemExit("A1 HTML is unexpectedly small")

          for marker in [
              "A1 PROFESSIONAL MARKET DASHBOARD",
              "Sector Rotation Heatmap",
              "What Changed Since the Prior Successful Scan",
              "Seven-session",
              "Daily research - not entry-ready",
          ]:
              if marker not in a1_html:
                  raise SystemExit(
                      "Final dashboard marker missing: " + marker
                  )

          escaped_span = chr(38) + "lt;span title="
          backslash_span = chr(92) + "<span title="

          if (
              escaped_span in a1_html
              or backslash_span in a1_html
          ):
              raise SystemExit(
                  "Seven-session strip markup is escaped"
              )

          original_html = (
              docs / "TopBottom_Universal.html"
          ).read_text(encoding="utf-8")

          if (
              len(original_html.encode("utf-8")) < 20000
              or ".page.active" not in original_html
          ):
              raise SystemExit(
                  "Original dashboard size/CSS audit failed"
              )

          for marker in [
              "renderSummary",
              "renderAlerts",
              "renderSectors",
              "renderBlocked",
              "renderHistory",
              "function show",
          ]:
              if marker not in original_html:
                  raise SystemExit(
                      "Original dashboard marker missing: " + marker
                  )

          scripts = [
              script.strip()
              for script in re.findall(
                  r"<script\b[^>]*>(.*?)</script\s*>",
                  original_html,
                  re.S | re.I,
              )
              if script.strip()
          ]

          if not scripts:
              raise SystemExit(
                  "No inline dashboard JavaScript found"
              )

          with tempfile.TemporaryDirectory() as tmp:
              for index, script in enumerate(scripts):
                  path = Path(tmp) / (
                      "dashboard_" + str(index) + ".js"
                  )
                  path.write_text(script, encoding="utf-8")
                  subprocess.run(
                      ["node", "--check", str(path)],
                      check=True,
                  )

          print("A1 generated:", audit["generated_at"])
          print(
              "Section 11:",
              changes["status"],
              "events:",
              len(changes.get("events", [])),
          )
          print("Ultimate dashboard:", ultimate["version"])
          print("AI bytes:", ai_bytes)
          print("Original dashboard and final A1 validations passed")
          PY

      - name: Send dashboard email
        id: email
        if: steps.scanner.outputs.did_run == 'true'
        continue-on-error: true
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EVENT_NAME: ${{ github.event_name }}
          A1_FORCE_EMAIL: ${{ inputs.send_email }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          scheduled = (
              os.environ.get("EVENT_NAME") == "schedule"
          )

          if scheduled:
              today = datetime.now(
                  ZoneInfo("America/New_York")
              ).date().isoformat()

              state_path = Path("docs/a1_email_state.json")

              if state_path.exists():
                  state = json.loads(
                      state_path.read_text(encoding="utf-8")
                  )

                  if state.get("last_sent_date") == today:
                      print(
                          "Email decision: SKIP - already sent today"
                      )
                      raise SystemExit(0)

              # Scheduled reports may email on weekends,
              # holidays, or after a delayed start.
              # Report-quality checks remain enabled.
              os.environ["A1_FORCE_EMAIL"] = "true"

              print(
                  "Daily scheduled email enabled, "
                  "including weekends and holidays."
              )

          import a1_email_sender
          raise SystemExit(a1_email_sender.main())
          PY

      - name: Commit and push validated docs only
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed during this scan."
            echo "Nothing pushed; rerun from latest main."
            exit 1
          fi

          SCAN_TIME=$(TZ=America/New_York date +"%Y-%m-%d %H:%M ET")

          git commit -m "A1 scan: ${SCAN_TIME} - final validated dashboard"
          git push origin HEAD:main

      - name: Final verification summary
        if: steps.scanner.outputs.did_run == 'true'
        env:
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        run: |
          echo "Validated dashboard published."
          echo "Scheduled start target: 2:00 PM Eastern every day."
          echo "Weekends and holidays are included."
          echo "There is no workflow market-hours skip."
          echo "Email step outcome: $EMAIL_OUTCOME"
          echo "Open the email step log for SEND or SKIP details."
          echo "Power Automate is not required."

          if [ "$EMAIL_OUTCOME" = "failure" ]; then
            echo "::warning::Dashboard published, but email failed. Open Send dashboard email."
          fi
