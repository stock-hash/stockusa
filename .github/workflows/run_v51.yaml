name: Market Scanner v5

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
  RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear yfinance cache
        run: rm -rf ~/.cache/py-yfinance ~/.cache/yfinance

      - name: Run scanner
        run: python run_github.py

      - name: Commit updated data
        run: |
          git config user.name "Market Scanner Bot"
          git config user.email "scanner@github.actions"
          git add docs/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "📊 Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
