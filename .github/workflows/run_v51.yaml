name: Market Scanner v5.6 Fixed

on:
  schedule:
    # EDT window (UTC-4): 9:35 AM-4:10 PM ET = 13:35-20:10 UTC
    - cron: '5,20,35,50 13-20 * * 1-5'
    # EST window (UTC-5): 9:35 AM-4:10 PM ET = 14:35-21:10 UTC
    - cron: '5,20,35,50 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/New_York

concurrency:
  group: stockusa-dashboard-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz python-dotenv peewee

      - name: Debug trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "New York time:"
          TZ=America/New_York date

      - name: Check market hours
        id: market_check
        run: |
          python3 << 'PYEOF'
          import os
          import pytz
          from datetime import datetime

          et = pytz.timezone("US/Eastern")
          now = datetime.now(et)

          mkt_open = now.replace(hour=9, minute=25, second=0, microsecond=0)
          mkt_close = now.replace(hour=16, minute=15, second=0, microsecond=0)

          is_weekday = now.weekday() < 5
          in_hours = is_weekday and (mkt_open <= now <= mkt_close)

          print("Current ET:", now.strftime("%Y-%m-%d %I:%M:%S %p %Z"))
          print("Weekday:", is_weekday)
          print("In hours:", in_hours)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("run=%s\n" % ("true" if in_hours else "false"))
          PYEOF

      - name: Auto-patch run_github.py dashboard CSS only if exact known bug exists
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          p = Path("run_github.py")
          if not p.exists():
              print("run_github.py not found, skipping CSS patch")
              raise SystemExit(0)

          text = p.read_text(encoding="utf-8", errors="replace")
          old = ".page{display:none;padding:20px 22px}.page.activetable"
          new = ".page{display:none;padding:20px 22px}.page.active{display:block}table"

          if old in text:
              p.write_text(text.replace(old, new), encoding="utf-8")
              print("CSS PATCHED in run_github.py")
          elif ".page.active{display:block}" in text:
              print("run_github.py already contains .page.active display rule")
          else:
              print("Known CSS bug pattern not found. No source file changes made.")
          PYEOF

      - name: Run market scanner
        id: scanner
        if: steps.market_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          set -e
          echo "Starting Market Scanner v5.6 - Single Scan Mode..."
          python run_github.py
          echo "Scanner complete."
          echo "did_run=true" >> "$GITHUB_OUTPUT"

      - name: Safety audit generated docs
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          set -e
          echo "=== Output files after scanner ==="

          if [ ! -d docs ]; then
            echo "ERROR: docs directory missing after scanner run."
            exit 1
          fi

          ls -la docs/

          if [ ! -f docs/TopBottom_Universal.html ]; then
            echo "ERROR: docs/TopBottom_Universal.html missing after scanner run."
            exit 1
          fi

          DASH_BYTES=$(wc -c < docs/TopBottom_Universal.html)
          echo "Dashboard bytes: ${DASH_BYTES}"

          # Guardrail: do not publish a tiny broken dashboard or redirect wrapper.
          if [ "$DASH_BYTES" -lt 20000 ]; then
            echo "ERROR: Dashboard file is too small (${DASH_BYTES} bytes)."
            echo "This usually means the full dashboard was overwritten by a partial page or redirect."
            exit 1
          fi

          # Guardrail: make sure the page has the tab/page activation CSS rule.
          if grep -q ".page.active" docs/TopBottom_Universal.html; then
            echo "OK: Dashboard contains .page.active CSS/JS support."
          else
            echo "WARNING: .page.active not found in dashboard HTML. Tabs may not display correctly."
          fi

          # Guardrail: verify JSON output if available, but do not fail for optional files.
          if [ -f docs/latest_scan.json ]; then
            echo "latest_scan.json bytes: $(wc -c < docs/latest_scan.json)"
            python3 << 'PYEOF'
          import json
          from pathlib import Path

          p = Path("docs/latest_scan.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          summary = d.get("summary", {}) if isinstance(d.get("summary", {}), dict) else {}
          alerts = d.get("alerts", [])
          if not isinstance(alerts, list):
              alerts = []

          scan_time = d.get("scan_time") or summary.get("scan_time") or "N/A"
          total_alerts = d.get("total_alerts")
          if total_alerts is None:
              total_alerts = len(alerts)

          near_miss = d.get("near_miss_count")
          if near_miss is None:
              near_miss = summary.get("near_miss_count", 0)

          print("Scan time:", scan_time)
          print("Alerts:", total_alerts)
          print("Near-miss:", near_miss)
          PYEOF
          else
            echo "WARNING: docs/latest_scan.json missing. Continuing because some scanner versions embed data directly in HTML."
          fi

          if [ -f docs/prices.json ]; then
            echo "prices.json bytes: $(wc -c < docs/prices.json)"
          else
            echo "WARNING: docs/prices.json missing."
          fi

          if [ -f docs/charts.json ]; then
            echo "charts.json bytes: $(wc -c < docs/charts.json)"
          else
            echo "WARNING: docs/charts.json missing."
          fi

      - name: Commit and push generated dashboard files
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Save generated docs to temp ==="
          rm -rf /tmp/generated_docs
          mkdir -p /tmp/generated_docs
          cp -R docs/. /tmp/generated_docs/

          echo "=== Sync local repo with latest origin/main ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Restore newly generated docs over latest repo ==="
          mkdir -p docs
          rm -rf docs/*
          cp -R /tmp/generated_docs/. docs/

          echo "=== Git status after restoring generated docs ==="
          git status --short

          echo "=== Stage docs files ==="
          git add docs/

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          SCAN_TIME=$(TZ=America/New_York date +"%Y-%m-%d %H:%M ET")
          ALERTS=$(python3 - << 'PYEOF'
          import json
          from pathlib import Path
          try:
              d = json.loads(Path("docs/latest_scan.json").read_text(encoding="utf-8"))
              alerts = d.get("total_alerts")
              if alerts is None:
                  raw = d.get("alerts", [])
                  alerts = len(raw) if isinstance(raw, list) else 0
              print(alerts)
          except Exception:
              print(0)
          PYEOF
          )
          NEARMISS=$(python3 - << 'PYEOF'
          import json
          from pathlib import Path
          try:
              d = json.loads(Path("docs/latest_scan.json").read_text(encoding="utf-8"))
              summary = d.get("summary", {}) if isinstance(d.get("summary", {}), dict) else {}
              print(d.get("near_miss_count", summary.get("near_miss_count", 0)))
          except Exception:
              print(0)
          PYEOF
          )

          git commit -m "Scan: ${SCAN_TIME} - ${ALERTS} alerts, ${NEARMISS} near-miss"

          echo "=== Push dashboard update ==="
          git push origin HEAD:main

          echo "Results pushed to GitHub Pages source branch."

      - name: Final verification summary
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          echo "Workflow completed."
          echo "This fixed workflow does NOT rebuild or replace your full dashboard HTML."
          echo "It preserves whatever run_github.py generated into docs/."
          echo "Check these files after GitHub Pages refresh:"
          echo "https://stock-hash.github.io/stockusa/latest_scan.json"
          echo "https://stock-hash.github.io/stockusa/prices.json"
          echo "https://stock-hash.github.io/stockusa/charts.json"
          echo "https://stock-hash.github.io/stockusa/TopBottom_Universal.html"

      - name: No scan outside market hours
        if: steps.market_check.outputs.run != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "Outside market hours. Scheduled run skipped."
