name: Market Scanner v5.6

on:
  schedule:
    # EDT window (UTC-4): 9:35 AM-4:10 PM ET = 13:35-20:10 UTC
    - cron: '5,20,35,50 13-20 * * 1-5'
    # EST window (UTC-5): 9:35 AM-4:10 PM ET = 14:35-21:10 UTC
    - cron: '5,20,35,50 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/New_York

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: scanner-push
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz python-dotenv peewee

      - name: Debug trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          date -u
          TZ=America/New_York date

      - name: Check market hours
        id: market_check
        run: |
          python3 << 'PYEOF'
          import pytz
          from datetime import datetime
          import os

          et = pytz.timezone("US/Eastern")
          now = datetime.now(et)

          mkt_open = now.replace(hour=9, minute=25, second=0, microsecond=0)
          mkt_close = now.replace(hour=16, minute=15, second=0, microsecond=0)

          is_weekday = now.weekday() < 5
          in_hours = is_weekday and (mkt_open <= now <= mkt_close)

          print("Current ET:", now.strftime("%Y-%m-%d %I:%M:%S %p %Z"))
          print("Weekday:", is_weekday)
          print("In hours:", in_hours)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("run=%s\n" % ("true" if in_hours else "false"))
          PYEOF

      - name: Run market scanner
        if: steps.market_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "Starting Market Scanner v5.6 — Single Scan Mode..."
          python run_github.py
          echo "Scanner complete."

      - name: Verify output
        run: |
          echo "=== Output files ==="
          ls -la docs/ || echo "No docs directory"

          if [ -f docs/TopBottom_Universal.html ]; then
            echo "Dashboard: $(wc -c < docs/TopBottom_Universal.html) bytes"
          fi

          if [ -f docs/latest_scan.json ]; then
            echo "JSON: $(wc -c < docs/latest_scan.json) bytes"
            python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print('Alerts:', d.get('total_alerts',0), 'Near-miss:', d.get('near_miss_count',0))"
          fi

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" || {
            SCAN_TIME=$(TZ=America/New_York date +"%Y-%m-%d %H:%M ET")
            ALERTS=$(python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print(d.get('total_alerts',0))" 2>/dev/null || echo "0")
            NEARMISS=$(python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print(d.get('near_miss_count',0))" 2>/dev/null || echo "0")
            git commit -m "Scan: ${SCAN_TIME} - ${ALERTS} alerts, ${NEARMISS} near-miss"
            git pull --rebase origin main || {
              echo "Rebase conflict — forcing recovery..."
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-rebase --strategy-option theirs
              git add docs/
              git commit -m "Scan: ${SCAN_TIME} - ${ALERTS} alerts (merge recovery)" --allow-empty
            }
            git push
            echo "Results pushed to GitHub Pages"
          }
