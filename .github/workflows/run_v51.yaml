# ═══════════════════════════════════════════════════════════════
# Scanner v5.1 — GitHub Actions Workflow
# Runs during US market hours, generates HTML report,
# deploys to GitHub Pages automatically.
# ═══════════════════════════════════════════════════════════════
name: Scanner v5.1 Report & Deploy

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 9:30 AM ET
    - cron: '0 14 * * 1-5'    # 10:00 AM ET
    - cron: '30 14 * * 1-5'   # 10:30 AM ET
    - cron: '0 15 * * 1-5'    # 11:00 AM ET
    - cron: '30 15 * * 1-5'   # 11:30 AM ET
    - cron: '0 16 * * 1-5'    # 12:00 PM ET
    - cron: '30 16 * * 1-5'   # 12:30 PM ET
    - cron: '0 17 * * 1-5'    # 1:00 PM ET
    - cron: '30 17 * * 1-5'   # 1:30 PM ET
    - cron: '0 18 * * 1-5'    # 2:00 PM ET
    - cron: '30 18 * * 1-5'   # 2:30 PM ET
    - cron: '0 19 * * 1-5'    # 3:00 PM ET
    - cron: '30 19 * * 1-5'   # 3:30 PM ET
    - cron: '0 20 * * 1-5'    # 4:00 PM ET — Close
    - cron: '30 20 * * 1-5'   # 4:30 PM ET — Summary

  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/New_York
  PYTHONUNBUFFERED: '1'

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(' requirements_v51.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r  requirements_v51.txt

      - name: Run Scanner v5.1
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          echo "=== Scanner v5.1 starting at $(date) ==="
          python generate_report_v51.py
          echo "=== Scanner v5.1 completed at $(date) ==="

      - name: Deploy to GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet || git commit -m "v5.1 scan update $(date +'%Y-%m-%d %H:%M ET')"
          git push
