name: Market Scanner v5.6

on:
  schedule:
    # EDT window (UTC-4): 9:35 AM-4:10 PM ET = 13:35-20:10 UTC
    - cron: '5,20,35,50 13-20 * * 1-5'
    # EST window (UTC-5): 9:35 AM-4:10 PM ET = 14:35-21:10 UTC
    - cron: '5,20,35,50 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/New_York

# IMPORTANT:
# One dashboard writer at a time.
# Do not cancel a running scan in the middle of writing/pushing docs.
concurrency:
  group: stockusa-dashboard-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz python-dotenv peewee

      - name: Debug trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "New York time:"
          TZ=America/New_York date

      - name: Check market hours
        id: market_check
        run: |
          python3 << 'PYEOF'
          import pytz
          from datetime import datetime
          import os

          et = pytz.timezone("US/Eastern")
          now = datetime.now(et)

          mkt_open = now.replace(hour=9, minute=25, second=0, microsecond=0)
          mkt_close = now.replace(hour=16, minute=15, second=0, microsecond=0)

          is_weekday = now.weekday() < 5
          in_hours = is_weekday and (mkt_open <= now <= mkt_close)

          print("Current ET:", now.strftime("%Y-%m-%d %I:%M:%S %p %Z"))
          print("Weekday:", is_weekday)
          print("In hours:", in_hours)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("run=%s\n" % ("true" if in_hours else "false"))
          PYEOF

      - name: Auto-patch run_github.py dashboard CSS
        run: |
          python - << 'PYEOF'
          from pathlib import Path
          p = Path("run_github.py")
          if not p.exists():
              print("run_github.py not found, skipping patch")
              raise SystemExit(0)
          text = p.read_text(encoding="utf-8")
          old = ".page{display:none;padding:20px 22px}.page.activetable"
          new = ".page{display:none;padding:20px 22px}.page.active{display:block}table"
          if old in text:
              p.write_text(text.replace(old, new), encoding="utf-8")
              print("CSS PATCHED: dashboard tabs will now display correctly")
          elif ".page.active{display:block}" in text:
              print("Already patched, skipping")
          else:
              print("Warning: patched pattern not found - check run_github.py manually")
          PYEOF
      - name: Run market scanner
        id: scanner
        
        if: steps.market_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "Starting Market Scanner v5.6 — Single Scan Mode..."
          python run_github.py
          echo "Scanner complete."
          echo "did_run=true" >> "$GITHUB_OUTPUT"

      - name: Verify generated output
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          echo "=== Output files ==="
          ls -la docs/ || {
            echo "ERROR: docs directory missing"
            exit 1
          }

          if [ -f docs/TopBottom_Universal.html ]; then
            echo "Dashboard: $(wc -c < docs/TopBottom_Universal.html) bytes"
          else
            echo "ERROR: docs/TopBottom_Universal.html missing"
            exit 1
          fi

          if [ -f docs/latest_scan.json ]; then
            echo "latest_scan.json: $(wc -c < docs/latest_scan.json) bytes"
            python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print('Scan time:', d.get('scan_time')); print('Alerts:', d.get('total_alerts',0)); print('Near-miss:', d.get('near_miss_count',0))"
          else
            echo "ERROR: docs/latest_scan.json missing"
            exit 1
          fi

          if [ -f docs/prices.json ]; then
            echo "prices.json: $(wc -c < docs/prices.json) bytes"
            python3 -c "import json; d=json.load(open('docs/prices.json')); print('Prices timestamp:', d.get('timestamp')); print('Prices count:', d.get('count'))"
          else
            echo "WARNING: docs/prices.json missing"
          fi

          if [ -f docs/charts.json ]; then
            echo "charts.json: $(wc -c < docs/charts.json) bytes"
          else
            echo "WARNING: docs/charts.json missing"
          fi

      - name: Commit and push generated dashboard files
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Save generated docs to temp ==="
          rm -rf /tmp/generated_docs
          mkdir -p /tmp/generated_docs
          cp -R docs/. /tmp/generated_docs/

          echo "=== Sync local repo with latest origin/main ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Restore newly generated docs over latest repo ==="
          mkdir -p docs
          rm -rf docs/*
          cp -R /tmp/generated_docs/. docs/

          echo "=== Git status after restoring generated docs ==="
          git status --short

          echo "=== Stage docs files ==="
          git add docs/

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          SCAN_TIME=$(TZ=America/New_York date +"%Y-%m-%d %H:%M ET")
          ALERTS=$(python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print(d.get('total_alerts',0))" 2>/dev/null || echo "0")
          NEARMISS=$(python3 -c "import json; d=json.load(open('docs/latest_scan.json')); print(d.get('near_miss_count',0))" 2>/dev/null || echo "0")

          git commit -m "Scan: ${SCAN_TIME} - ${ALERTS} alerts, ${NEARMISS} near-miss"

          echo "=== Push dashboard update ==="
          git push origin HEAD:main

          echo "Results pushed to GitHub Pages source branch."

      - name: Final verification summary
        if: steps.scanner.outputs.did_run == 'true'
        run: |
          echo "Workflow completed."
          echo "Check these files after GitHub Pages refresh:"
          echo "https://stock-hash.github.io/stockusa/latest_scan.json"
          echo "https://stock-hash.github.io/stockusa/prices.json"
          echo "https://stock-hash.github.io/stockusa/charts.json"
          echo "https://stock-hash.github.io/stockusa/TopBottom_Universal.html"
